stages:
  - build_debug
  - build_release
  - compile_lammps_with_tadah

cache:
    key: "build-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - ${BUILD_DIR}

before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_SHARED_DIR}
  - mkdir -p ${RELEASE_STATIC_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build_debug:
  stage: build_debug
  script:
    - cd ${DEBUG_DIR}
    - cmake ../.. -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage" -DTADAH_ENABLE_OPENMP=ON -DBUILD_TESTING=ON
    - make -j ${CPU_BUILD}
    - make test
    - cd ..; gcovr -e '.*tests.*|.*lib.*|.*ML-TADAH.*|build' -r .
  coverage: /^TOTAL.*\s+(\d+\%)$/

build_release_shared:
  stage: build_release
  script:
    - cd ${RELEASE_SHARED_DIR}
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

build_release_static:
  stage: build_release
  script:
    - cd ${RELEASE_STATIC_DIR}
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

compile_lammps_with_tadah:
  stage: compile_lammps_with_tadah
  script:
    - mkdir -p ~/opt
    - git clone -b stable --depth 1  https://github.com/lammps/lammps.git ~/opt/lammps
    - git clone -b "$CI_COMMIT_REF_NAME" --depth 1 https://git.ecdf.ed.ac.uk/tadah/tadah.lammps.git ~/opt/lammps/lib/tadah.lammps    
    - cd ~/opt/lammps/src
    - make -j10 serial
    - make lib-tadah.lammps
    - make yes-ml-tadah
    - make -j10 serial
