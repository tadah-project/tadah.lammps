[CGRID2B]
default      =   []
value_type   =   ''
value_format =   ''
value_N      =   [-2147483647]
description  =  """This KEY controls the position parameters used \
by the radial basis functions of a two-body descriptor, \
e.g., position of a Gaussian function. \
The parameter list can be provided manually or generated automatically. \
This key is often used together with SGRID2B_. \
It is usually the case that both CGRID2B_ and SGRID2B_ must be the same size. \
In most cases the maximum value should be smaller than the cutoff distance \
used for the two-body descriptor. \
Note, that not all descriptors use this parameter, e.g., :cpp:class:`D2_LJ` has a fixed grid."""
examples     =  []
[CGRID2B.manual]
value_type   =   ['double']
value_format =   ['N1 N2 N3 ...']
value_N      =   []
description  =  """Provide grid manually. Each number must be greater than zero."""
examples     =  ['CGRID2B 1.14 3.45 4.55 6.73']
[CGRID2B.auto]
value_type   =   ['int', 'int', 'double', 'double']
value_format =   ['-A', 'N', 'min', 'max']
value_N      =   []
description  =  """Generate grid using one of two available algorithms. \
The grid contains :code:`N` points between :code:`min` and :code:`max` positions, inclusive. \
Both :code:`min` and :code:`max` values must be positive. \
The algorithm :code:`-A` is selected as either :code:`-1` or :code:`-2`. \
Note the minus in front of :code:`-A`. \
Algorithm :code:`-1` provides evenly spaced points between `min` and `max` on a linear scale. \
Algorithm :code:`-2` as above but on the log scale."""
examples     =  ['CGRID2B -1 6 1.0 6.73', 'CGRID2B -2 6 1.0 6.73']

