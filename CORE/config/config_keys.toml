[LAMBDA]
default      =   [0]
value_type   =   ['int | double']
value_format =   ['N']
value_N      =   [1]
description  =  """This KEY controls regularisation parameter :math:`\\lambda` for both \
:cpp:class:`M_BLR` and :cpp:class:`M_KRR`. \
If :code:`N=0` than no regularisation is being applied. \
If :code:`N>0` than :math:`\\lambda` is set to this value of :code:`N`. \
If :code:`N<0` than evidence-approximation algorithm is used \
to estimate the value of :math:`\\lambda`. """
examples     =  ['LAMBDA -1', 'LAMBDA 1e-4']

