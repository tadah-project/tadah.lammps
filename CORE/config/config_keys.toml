[SGRID2B.auto]
value_type   =   ['int', 'int', 'double', 'double']
value_format =   ['-A', 'N', 'min', 'max']
value_N      =   []
description  =  """Generate grid using one of two available algorithms. \
The grid contains :code:`N` points between :code:`min` and :code:`max`, inclusive. \
Both :code:`min` and :code:`max` values must be positive. \
The algorithm :code:`-A` is selected as either :code:`-1` or :code:`-2`. \
Note the minus in front of :code:`-A`. \
Algorithm :code:`-1` provides evenly spaced points between :code:`min` and :code:`max` on a linear scale. \
Algorithm :code:`-2` as above but on the log scale."""
