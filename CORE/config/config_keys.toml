[EWEIGHT]
default      =   [1.0]
value_type   =   ['double']
value_format =   ['N']
value_N      =   [1]
description  =  """Global energy scalling factor for all configurations \ 
used in the training process. \ 
Note that energies are always scalled by 1/number of atoms. \
Individual scalling factors for every configuration can be set \
in a dataset file. \
The combined scalling factor is: \
EWEIGHT*(configuration eweight)/(number of atoms)"""
examples     =  ['EWEIGHT 0.96']

[FWEIGHT]
default      =   [1.0]
value_type   =   ['double']
value_format =   ['N']
value_N      =   [1]
description  =  """Global force scalling factor for all configurations \
used in the training process. \
Note that each force component is always scalled by 1/(number of atoms)/3. \
Individual scalling factors for every configuration can be set \
in a dataset file. \
The combined scalling factor is: \
FWEIGHT*(configuration fweight)/(number of atoms)/3"""
examples     =  ['FWEIGHT 1e-2']

[SWEIGHT]
default      =   [1.0]
value_type   =   ['double']
value_format =   ['N']
value_N      =   [1]
description  =  """Global stress scalling factor for all configurations \
used in the training process. \
Note that each stress component is always scalled by 1/6.\
Individual scalling factors for every configuration can be set \
in a dataset file.\
The combined scalling factor is:\
SWEIGHT*(configuration sweight)/6"""
examples     =  ['SWEIGHT 1e-1']

